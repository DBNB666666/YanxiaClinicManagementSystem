appId: com.yanxia.clinic
productName: 燕霞诊所管理系统
electronDist: node_modules/electron/dist
npmRebuild: false
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
win:
  target:
    - target: zip
      arch: [x64]
  artifactName: YanxiaClinicManagementSystem-${version}-win-x64.${ext}
