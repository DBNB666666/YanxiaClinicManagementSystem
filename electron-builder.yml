appId: com.yanxia.clinic
productName: 燕霞诊所管理系统
executableName: yanxia-clinic
electronDist: node_modules/electron/dist
npmRebuild: false
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  - from: src/renderer/src/assets/prescription-template.jpg
    to: prescription-template.jpg
extraFiles:
  - from: scripts/start-yanxia.cmd
    to: 启动燕霞诊所管理系统.cmd
  - from: docs/START-HERE.txt
    to: 启动说明.txt
win:
  target:
    - target: zip
      arch: [x64]
  artifactName: YanxiaClinicManagementSystem-${version}-win-x64.${ext}
